  <div id="redoc-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
  <script>
    const spec = "openapi: 3.0.3\r\ninfo:\r\n  title: Todo Application API\r\n  description: |\r\n    A comprehensive RESTful API for managing todos, user authentication, categories, tags, and user profiles.\r\n    \r\n    ## Features\r\n    - JWT-based authentication with refresh tokens\r\n    - Complete todo CRUD operations with advanced filtering\r\n    - Category and tag management for organization\r\n    - User profile management\r\n    - Full-text search capabilities\r\n    - Bulk operations support\r\n    - Soft delete functionality\r\n    \r\n    ## Authentication\r\n    This API uses JWT Bearer tokens for authentication. Include the token in the Authorization header:\r\n    `Authorization: Bearer <your-jwt-token>`\r\n    \r\n  version: 1.0.0\r\n  contact:\r\n    name: Todo API Support\r\n    url: https://github.com/your-org/todo-app\r\n  license:\r\n    name: MIT\r\n    url: https://opensource.org/licenses/MIT\r\n\r\nservers:\r\n  - url: http://localhost:3000/api\r\n    description: Development server\r\n  - url: https://api.todoapp.com/api\r\n    description: Production server\r\n\r\nsecurity:\r\n  - bearerAuth: []\r\n\r\npaths:\r\n  # Health Check\r\n  /health:\r\n    get:\r\n      tags:\r\n        - Health\r\n      summary: Health check endpoint\r\n      description: Returns the health status of the API\r\n      security: []\r\n      responses:\r\n        '200':\r\n          description: API is healthy\r\n          content:\r\n            application/json:\r\n              schema:\r\n                type: object\r\n                properties:\r\n                  status:\r\n                    type: string\r\n                    example: \"healthy\"\r\n                  timestamp:\r\n                    type: string\r\n                    format: date-time\r\n                  version:\r\n                    type: string\r\n                    example: \"1.0.0\"\r\n\r\n  # Authentication Endpoints\r\n  /auth/register:\r\n    post:\r\n      tags:\r\n        - Authentication\r\n      summary: Register a new user\r\n      description: Create a new user account with email and password\r\n      security: []\r\n      requestBody:\r\n        required: true\r\n        content:\r\n          application/json:\r\n            schema:\r\n              type: object\r\n              required:\r\n                - email\r\n                - password\r\n                - name\r\n              properties:\r\n                email:\r\n                  type: string\r\n                  format: email\r\n                  example: \"user@example.com\"\r\n                password:\r\n                  type: string\r\n                  minLength: 8\r\n                  example: \"SecurePass123\"\r\n                  description: \"Must contain at least 8 characters with uppercase, lowercase, and number\"\r\n                name:\r\n                  type: string\r\n                  maxLength: 100\r\n                  example: \"John Doe\"\r\n      responses:\r\n        '201':\r\n          description: User registered successfully\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/AuthResponse'\r\n        '400':\r\n          $ref: '#/components/responses/BadRequest'\r\n        '409':\r\n          description: Email already exists\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/Error'\r\n        '422':\r\n          $ref: '#/components/responses/ValidationError'\r\n        '429':\r\n          $ref: '#/components/responses/RateLimited'\r\n\r\n  /auth/login:\r\n    post:\r\n      tags:\r\n        - Authentication\r\n      summary: Login user\r\n      description: Authenticate user and return JWT tokens\r\n      security: []\r\n      requestBody:\r\n        required: true\r\n        content:\r\n          application/json:\r\n            schema:\r\n              type: object\r\n              required:\r\n                - email\r\n                - password\r\n              properties:\r\n                email:\r\n                  type: string\r\n                  format: email\r\n                password:\r\n                  type: string\r\n      responses:\r\n        '200':\r\n          description: Login successful\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/AuthResponse'\r\n        '400':\r\n          $ref: '#/components/responses/BadRequest'\r\n        '401':\r\n          description: Invalid credentials\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/Error'\r\n        '429':\r\n          $ref: '#/components/responses/RateLimited'\r\n\r\n  /auth/logout:\r\n    post:\r\n      tags:\r\n        - Authentication\r\n      summary: Logout user\r\n      description: Invalidate the current session and refresh token\r\n      responses:\r\n        '200':\r\n          description: Logout successful\r\n          content:\r\n            application/json:\r\n              schema:\r\n                type: object\r\n                properties:\r\n                  message:\r\n                    type: string\r\n                    example: \"Logged out successfully\"\r\n        '401':\r\n          $ref: '#/components/responses/Unauthorized'\r\n\r\n  /auth/refresh:\r\n    post:\r\n      tags:\r\n        - Authentication\r\n      summary: Refresh access token\r\n      description: Get a new access token using a valid refresh token\r\n      security: []\r\n      requestBody:\r\n        required: true\r\n        content:\r\n          application/json:\r\n            schema:\r\n              type: object\r\n              required:\r\n                - refreshToken\r\n              properties:\r\n                refreshToken:\r\n                  type: string\r\n      responses:\r\n        '200':\r\n          description: Token refreshed successfully\r\n          content:\r\n            application/json:\r\n              schema:\r\n                type: object\r\n                properties:\r\n                  accessToken:\r\n                    type: string\r\n                  expiresIn:\r\n                    type: integer\r\n                    example: 900\r\n        '401':\r\n          description: Invalid refresh token\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/Error'\r\n\r\n  /auth/me:\r\n    get:\r\n      tags:\r\n        - Authentication\r\n      summary: Get current user info\r\n      description: Returns information about the currently authenticated user\r\n      responses:\r\n        '200':\r\n          description: Current user information\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/User'\r\n        '401':\r\n          $ref: '#/components/responses/Unauthorized'\r\n\r\n  # User Profile Endpoints\r\n  /profile:\r\n    get:\r\n      tags:\r\n        - Profile\r\n      summary: Get user profile\r\n      description: Returns the current user's profile information\r\n      responses:\r\n        '200':\r\n          description: User profile\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/UserProfile'\r\n        '401':\r\n          $ref: '#/components/responses/Unauthorized'\r\n    \r\n    put:\r\n      tags:\r\n        - Profile\r\n      summary: Update user profile\r\n      description: Update the current user's profile information\r\n      requestBody:\r\n        required: true\r\n        content:\r\n          application/json:\r\n            schema:\r\n              type: object\r\n              properties:\r\n                name:\r\n                  type: string\r\n                  maxLength: 100\r\n                email:\r\n                  type: string\r\n                  format: email\r\n                timezone:\r\n                  type: string\r\n                  example: \"America/New_York\"\r\n                preferences:\r\n                  type: object\r\n                  properties:\r\n                    theme:\r\n                      type: string\r\n                      enum: [light, dark]\r\n                    notifications:\r\n                      type: boolean\r\n                    emailNotifications:\r\n                      type: boolean\r\n      responses:\r\n        '200':\r\n          description: Profile updated successfully\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/UserProfile'\r\n        '400':\r\n          $ref: '#/components/responses/BadRequest'\r\n        '401':\r\n          $ref: '#/components/responses/Unauthorized'\r\n        '422':\r\n          $ref: '#/components/responses/ValidationError'\r\n\r\n    delete:\r\n      tags:\r\n        - Profile\r\n      summary: Deactivate user account\r\n      description: Soft delete the user account (reversible)\r\n      responses:\r\n        '200':\r\n          description: Account deactivated successfully\r\n          content:\r\n            application/json:\r\n              schema:\r\n                type: object\r\n                properties:\r\n                  message:\r\n                    type: string\r\n                    example: \"Account deactivated successfully\"\r\n        '401':\r\n          $ref: '#/components/responses/Unauthorized'\r\n\r\n  /profile/password:\r\n    put:\r\n      tags:\r\n        - Profile\r\n      summary: Change user password\r\n      description: Change the current user's password\r\n      requestBody:\r\n        required: true\r\n        content:\r\n          application/json:\r\n            schema:\r\n              type: object\r\n              required:\r\n                - currentPassword\r\n                - newPassword\r\n              properties:\r\n                currentPassword:\r\n                  type: string\r\n                newPassword:\r\n                  type: string\r\n                  minLength: 8\r\n                  description: \"Must contain at least 8 characters with uppercase, lowercase, and number\"\r\n      responses:\r\n        '200':\r\n          description: Password changed successfully\r\n          content:\r\n            application/json:\r\n              schema:\r\n                type: object\r\n                properties:\r\n                  message:\r\n                    type: string\r\n                    example: \"Password changed successfully\"\r\n        '400':\r\n          description: Invalid current password\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/Error'\r\n        '401':\r\n          $ref: '#/components/responses/Unauthorized'\r\n        '422':\r\n          $ref: '#/components/responses/ValidationError'\r\n\r\n  # Todo Endpoints\r\n  /todos:\r\n    get:\r\n      tags:\r\n        - Todos\r\n      summary: Get user's todos\r\n      description: |\r\n        Retrieve todos for the authenticated user with optional filtering, sorting, and pagination.\r\n        \r\n        **Filtering Options:**\r\n        - `filter`: active, completed, all\r\n        - `priority`: low, medium, high, critical\r\n        - `categoryId`: filter by category\r\n        - `tags`: comma-separated list of tags\r\n        - `dueDate`: today, week, overdue, or specific date\r\n        \r\n        **Sorting Options:**\r\n        - `sort`: title, dueDate, priority, createdAt, updatedAt\r\n        - Add `-` prefix for descending order (e.g., `-dueDate`)\r\n      parameters:\r\n        - name: page\r\n          in: query\r\n          schema:\r\n            type: integer\r\n            minimum: 1\r\n            default: 1\r\n        - name: limit\r\n          in: query\r\n          schema:\r\n            type: integer\r\n            minimum: 1\r\n            maximum: 100\r\n            default: 10\r\n        - name: filter\r\n          in: query\r\n          schema:\r\n            type: string\r\n            enum: [active, completed, all]\r\n            default: all\r\n        - name: priority\r\n          in: query\r\n          schema:\r\n            type: string\r\n            enum: [low, medium, high, critical]\r\n        - name: categoryId\r\n          in: query\r\n          schema:\r\n            type: string\r\n        - name: tags\r\n          in: query\r\n          schema:\r\n            type: string\r\n          description: Comma-separated list of tags\r\n        - name: dueDate\r\n          in: query\r\n          schema:\r\n            type: string\r\n          description: today, week, overdue, or ISO date string\r\n        - name: sort\r\n          in: query\r\n          schema:\r\n            type: string\r\n            default: createdAt\r\n          description: Field to sort by (prefix with - for descending)\r\n      responses:\r\n        '200':\r\n          description: List of todos\r\n          content:\r\n            application/json:\r\n              schema:\r\n                type: object\r\n                properties:\r\n                  todos:\r\n                    type: array\r\n                    items:\r\n                      $ref: '#/components/schemas/Todo'\r\n                  pagination:\r\n                    $ref: '#/components/schemas/Pagination'\r\n        '400':\r\n          $ref: '#/components/responses/BadRequest'\r\n        '401':\r\n          $ref: '#/components/responses/Unauthorized'\r\n\r\n    post:\r\n      tags:\r\n        - Todos\r\n      summary: Create a new todo\r\n      description: Create a new todo item\r\n      requestBody:\r\n        required: true\r\n        content:\r\n          application/json:\r\n            schema:\r\n              type: object\r\n              required:\r\n                - title\r\n              properties:\r\n                title:\r\n                  type: string\r\n                  maxLength: 200\r\n                  example: \"Complete project documentation\"\r\n                description:\r\n                  type: string\r\n                  maxLength: 1000\r\n                  example: \"Write comprehensive API documentation and user guides\"\r\n                dueDate:\r\n                  type: string\r\n                  format: date-time\r\n                  example: \"2024-12-31T23:59:59Z\"\r\n                priority:\r\n                  type: string\r\n                  enum: [low, medium, high, critical]\r\n                  default: medium\r\n                categoryId:\r\n                  type: string\r\n                  example: \"60d0fe4f5311236168a109ca\"\r\n                tags:\r\n                  type: array\r\n                  items:\r\n                    type: string\r\n                  maxItems: 10\r\n                  example: [\"work\", \"documentation\"]\r\n      responses:\r\n        '201':\r\n          description: Todo created successfully\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/Todo'\r\n        '400':\r\n          $ref: '#/components/responses/BadRequest'\r\n        '401':\r\n          $ref: '#/components/responses/Unauthorized'\r\n        '422':\r\n          $ref: '#/components/responses/ValidationError'\r\n\r\n  /todos/search:\r\n    get:\r\n      tags:\r\n        - Todos\r\n      summary: Search todos\r\n      description: Full-text search across todo titles and descriptions\r\n      parameters:\r\n        - name: q\r\n          in: query\r\n          required: true\r\n          schema:\r\n            type: string\r\n          description: Search query\r\n        - name: page\r\n          in: query\r\n          schema:\r\n            type: integer\r\n            minimum: 1\r\n            default: 1\r\n        - name: limit\r\n          in: query\r\n          schema:\r\n            type: integer\r\n            minimum: 1\r\n            maximum: 100\r\n            default: 10\r\n      responses:\r\n        '200':\r\n          description: Search results\r\n          content:\r\n            application/json:\r\n              schema:\r\n                type: object\r\n                properties:\r\n                  todos:\r\n                    type: array\r\n                    items:\r\n                      $ref: '#/components/schemas/TodoSearchResult'\r\n                  pagination:\r\n                    $ref: '#/components/schemas/Pagination'\r\n                  query:\r\n                    type: string\r\n                    description: The search query used\r\n        '400':\r\n          $ref: '#/components/responses/BadRequest'\r\n        '401':\r\n          $ref: '#/components/responses/Unauthorized'\r\n\r\n  /todos/bulk:\r\n    post:\r\n      tags:\r\n        - Todos\r\n      summary: Bulk operations on todos\r\n      description: Perform bulk operations on multiple todos\r\n      requestBody:\r\n        required: true\r\n        content:\r\n          application/json:\r\n            schema:\r\n              type: object\r\n              required:\r\n                - operation\r\n                - todoIds\r\n              properties:\r\n                operation:\r\n                  type: string\r\n                  enum: [complete, uncomplete, delete, update]\r\n                todoIds:\r\n                  type: array\r\n                  items:\r\n                    type: string\r\n                  minItems: 1\r\n                  maxItems: 100\r\n                data:\r\n                  type: object\r\n                  description: Data for update operation\r\n                  properties:\r\n                    priority:\r\n                      type: string\r\n                      enum: [low, medium, high, critical]\r\n                    categoryId:\r\n                      type: string\r\n                    tags:\r\n                      type: array\r\n                      items:\r\n                        type: string\r\n      responses:\r\n        '200':\r\n          description: Bulk operation completed\r\n          content:\r\n            application/json:\r\n              schema:\r\n                type: object\r\n                properties:\r\n                  message:\r\n                    type: string\r\n                    example: \"Bulk operation completed successfully\"\r\n                  affectedCount:\r\n                    type: integer\r\n                    example: 5\r\n        '400':\r\n          $ref: '#/components/responses/BadRequest'\r\n        '401':\r\n          $ref: '#/components/responses/Unauthorized'\r\n\r\n  /todos/{id}:\r\n    get:\r\n      tags:\r\n        - Todos\r\n      summary: Get a specific todo\r\n      description: Retrieve a specific todo by ID\r\n      parameters:\r\n        - name: id\r\n          in: path\r\n          required: true\r\n          schema:\r\n            type: string\r\n      responses:\r\n        '200':\r\n          description: Todo details\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/Todo'\r\n        '401':\r\n          $ref: '#/components/responses/Unauthorized'\r\n        '404':\r\n          $ref: '#/components/responses/NotFound'\r\n\r\n    put:\r\n      tags:\r\n        - Todos\r\n      summary: Update a todo\r\n      description: Update a specific todo\r\n      parameters:\r\n        - name: id\r\n          in: path\r\n          required: true\r\n          schema:\r\n            type: string\r\n      requestBody:\r\n        required: true\r\n        content:\r\n          application/json:\r\n            schema:\r\n              type: object\r\n              properties:\r\n                title:\r\n                  type: string\r\n                  maxLength: 200\r\n                description:\r\n                  type: string\r\n                  maxLength: 1000\r\n                dueDate:\r\n                  type: string\r\n                  format: date-time\r\n                priority:\r\n                  type: string\r\n                  enum: [low, medium, high, critical]\r\n                categoryId:\r\n                  type: string\r\n                tags:\r\n                  type: array\r\n                  items:\r\n                    type: string\r\n                  maxItems: 10\r\n      responses:\r\n        '200':\r\n          description: Todo updated successfully\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/Todo'\r\n        '400':\r\n          $ref: '#/components/responses/BadRequest'\r\n        '401':\r\n          $ref: '#/components/responses/Unauthorized'\r\n        '404':\r\n          $ref: '#/components/responses/NotFound'\r\n        '422':\r\n          $ref: '#/components/responses/ValidationError'\r\n\r\n    delete:\r\n      tags:\r\n        - Todos\r\n      summary: Delete a todo\r\n      description: Delete a specific todo (soft delete)\r\n      parameters:\r\n        - name: id\r\n          in: path\r\n          required: true\r\n          schema:\r\n            type: string\r\n      responses:\r\n        '200':\r\n          description: Todo deleted successfully\r\n          content:\r\n            application/json:\r\n              schema:\r\n                type: object\r\n                properties:\r\n                  message:\r\n                    type: string\r\n                    example: \"Todo deleted successfully\"\r\n        '401':\r\n          $ref: '#/components/responses/Unauthorized'\r\n        '404':\r\n          $ref: '#/components/responses/NotFound'\r\n\r\n  /todos/{id}/complete:\r\n    patch:\r\n      tags:\r\n        - Todos\r\n      summary: Toggle todo completion\r\n      description: Toggle the completion status of a todo\r\n      parameters:\r\n        - name: id\r\n          in: path\r\n          required: true\r\n          schema:\r\n            type: string\r\n      responses:\r\n        '200':\r\n          description: Todo completion status updated\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/Todo'\r\n        '401':\r\n          $ref: '#/components/responses/Unauthorized'\r\n        '404':\r\n          $ref: '#/components/responses/NotFound'\r\n\r\n  # Categories Endpoints\r\n  /categories:\r\n    get:\r\n      tags:\r\n        - Categories\r\n      summary: Get user's categories\r\n      description: Retrieve all categories for the authenticated user\r\n      responses:\r\n        '200':\r\n          description: List of categories\r\n          content:\r\n            application/json:\r\n              schema:\r\n                type: array\r\n                items:\r\n                  $ref: '#/components/schemas/Category'\r\n        '401':\r\n          $ref: '#/components/responses/Unauthorized'\r\n\r\n    post:\r\n      tags:\r\n        - Categories\r\n      summary: Create a new category\r\n      description: Create a new todo category\r\n      requestBody:\r\n        required: true\r\n        content:\r\n          application/json:\r\n            schema:\r\n              type: object\r\n              required:\r\n                - name\r\n              properties:\r\n                name:\r\n                  type: string\r\n                  maxLength: 50\r\n                  example: \"Work Projects\"\r\n                description:\r\n                  type: string\r\n                  maxLength: 200\r\n                  example: \"Tasks related to work projects\"\r\n                color:\r\n                  type: string\r\n                  pattern: '^#[0-9A-Fa-f]{6}$'\r\n                  example: \"#3498db\"\r\n      responses:\r\n        '201':\r\n          description: Category created successfully\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/Category'\r\n        '400':\r\n          $ref: '#/components/responses/BadRequest'\r\n        '401':\r\n          $ref: '#/components/responses/Unauthorized'\r\n        '409':\r\n          description: Category name already exists\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/Error'\r\n        '422':\r\n          $ref: '#/components/responses/ValidationError'\r\n\r\n  /categories/{id}:\r\n    put:\r\n      tags:\r\n        - Categories\r\n      summary: Update a category\r\n      description: Update a specific category\r\n      parameters:\r\n        - name: id\r\n          in: path\r\n          required: true\r\n          schema:\r\n            type: string\r\n      requestBody:\r\n        required: true\r\n        content:\r\n          application/json:\r\n            schema:\r\n              type: object\r\n              properties:\r\n                name:\r\n                  type: string\r\n                  maxLength: 50\r\n                description:\r\n                  type: string\r\n                  maxLength: 200\r\n                color:\r\n                  type: string\r\n                  pattern: '^#[0-9A-Fa-f]{6}$'\r\n      responses:\r\n        '200':\r\n          description: Category updated successfully\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/Category'\r\n        '400':\r\n          $ref: '#/components/responses/BadRequest'\r\n        '401':\r\n          $ref: '#/components/responses/Unauthorized'\r\n        '404':\r\n          $ref: '#/components/responses/NotFound'\r\n        '409':\r\n          description: Category name already exists\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/Error'\r\n        '422':\r\n          $ref: '#/components/responses/ValidationError'\r\n\r\n    delete:\r\n      tags:\r\n        - Categories\r\n      summary: Delete a category\r\n      description: Delete a category and move its todos to 'Uncategorized'\r\n      parameters:\r\n        - name: id\r\n          in: path\r\n          required: true\r\n          schema:\r\n            type: string\r\n      responses:\r\n        '200':\r\n          description: Category deleted successfully\r\n          content:\r\n            application/json:\r\n              schema:\r\n                type: object\r\n                properties:\r\n                  message:\r\n                    type: string\r\n                    example: \"Category deleted successfully\"\r\n        '401':\r\n          $ref: '#/components/responses/Unauthorized'\r\n        '404':\r\n          $ref: '#/components/responses/NotFound'\r\n\r\n  /categories/{id}/todos:\r\n    get:\r\n      tags:\r\n        - Categories\r\n      summary: Get todos in a category\r\n      description: Retrieve all todos in a specific category\r\n      parameters:\r\n        - name: id\r\n          in: path\r\n          required: true\r\n          schema:\r\n            type: string\r\n        - name: page\r\n          in: query\r\n          schema:\r\n            type: integer\r\n            minimum: 1\r\n            default: 1\r\n        - name: limit\r\n          in: query\r\n          schema:\r\n            type: integer\r\n            minimum: 1\r\n            maximum: 100\r\n            default: 10\r\n      responses:\r\n        '200':\r\n          description: Todos in the category\r\n          content:\r\n            application/json:\r\n              schema:\r\n                type: object\r\n                properties:\r\n                  todos:\r\n                    type: array\r\n                    items:\r\n                      $ref: '#/components/schemas/Todo'\r\n                  pagination:\r\n                    $ref: '#/components/schemas/Pagination'\r\n                  category:\r\n                    $ref: '#/components/schemas/Category'\r\n        '401':\r\n          $ref: '#/components/responses/Unauthorized'\r\n        '404':\r\n          $ref: '#/components/responses/NotFound'\r\n\r\n  # Tags Endpoints\r\n  /tags:\r\n    get:\r\n      tags:\r\n        - Tags\r\n      summary: Get user's tags\r\n      description: Retrieve all tags for the authenticated user with usage counts\r\n      responses:\r\n        '200':\r\n          description: List of tags\r\n          content:\r\n            application/json:\r\n              schema:\r\n                type: array\r\n                items:\r\n                  $ref: '#/components/schemas/Tag'\r\n        '401':\r\n          $ref: '#/components/responses/Unauthorized'\r\n\r\n  /tags/{id}:\r\n    delete:\r\n      tags:\r\n        - Tags\r\n      summary: Delete a tag\r\n      description: Delete an unused tag\r\n      parameters:\r\n        - name: id\r\n          in: path\r\n          required: true\r\n          schema:\r\n            type: string\r\n      responses:\r\n        '200':\r\n          description: Tag deleted successfully\r\n          content:\r\n            application/json:\r\n              schema:\r\n                type: object\r\n                properties:\r\n                  message:\r\n                    type: string\r\n                    example: \"Tag deleted successfully\"\r\n        '400':\r\n          description: Tag is still in use\r\n          content:\r\n            application/json:\r\n              schema:\r\n                $ref: '#/components/schemas/Error'\r\n        '401':\r\n          $ref: '#/components/responses/Unauthorized'\r\n        '404':\r\n          $ref: '#/components/responses/NotFound'\r\n\r\ncomponents:\r\n  securitySchemes:\r\n    bearerAuth:\r\n      type: http\r\n      scheme: bearer\r\n      bearerFormat: JWT\r\n\r\n  schemas:\r\n    User:\r\n      type: object\r\n      properties:\r\n        id:\r\n          type: string\r\n          example: \"60d0fe4f5311236168a109ca\"\r\n        email:\r\n          type: string\r\n          format: email\r\n          example: \"user@example.com\"\r\n        name:\r\n          type: string\r\n          example: \"John Doe\"\r\n        createdAt:\r\n          type: string\r\n          format: date-time\r\n        updatedAt:\r\n          type: string\r\n          format: date-time\r\n\r\n    UserProfile:\r\n      allOf:\r\n        - $ref: '#/components/schemas/User'\r\n        - type: object\r\n          properties:\r\n            timezone:\r\n              type: string\r\n              example: \"America/New_York\"\r\n            preferences:\r\n              type: object\r\n              properties:\r\n                theme:\r\n                  type: string\r\n                  enum: [light, dark]\r\n                notifications:\r\n                  type: boolean\r\n                emailNotifications:\r\n                  type: boolean\r\n\r\n    AuthResponse:\r\n      type: object\r\n      properties:\r\n        user:\r\n          $ref: '#/components/schemas/User'\r\n        accessToken:\r\n          type: string\r\n        refreshToken:\r\n          type: string\r\n        expiresIn:\r\n          type: integer\r\n          example: 900\r\n          description: Access token expiration time in seconds\r\n\r\n    Todo:\r\n      type: object\r\n      properties:\r\n        id:\r\n          type: string\r\n          example: \"60d0fe4f5311236168a109cb\"\r\n        title:\r\n          type: string\r\n          example: \"Complete project documentation\"\r\n        description:\r\n          type: string\r\n          example: \"Write comprehensive API documentation and user guides\"\r\n        dueDate:\r\n          type: string\r\n          format: date-time\r\n          nullable: true\r\n        priority:\r\n          type: string\r\n          enum: [low, medium, high, critical]\r\n          default: medium\r\n        completed:\r\n          type: boolean\r\n          default: false\r\n        categoryId:\r\n          type: string\r\n          nullable: true\r\n          example: \"60d0fe4f5311236168a109ca\"\r\n        tags:\r\n          type: array\r\n          items:\r\n            type: string\r\n          example: [\"work\", \"documentation\"]\r\n        userId:\r\n          type: string\r\n          example: \"60d0fe4f5311236168a109c9\"\r\n        createdAt:\r\n          type: string\r\n          format: date-time\r\n        updatedAt:\r\n          type: string\r\n          format: date-time\r\n        deletedAt:\r\n          type: string\r\n          format: date-time\r\n          nullable: true\r\n\r\n    TodoSearchResult:\r\n      allOf:\r\n        - $ref: '#/components/schemas/Todo'\r\n        - type: object\r\n          properties:\r\n            highlights:\r\n              type: object\r\n              description: Search result highlights\r\n              properties:\r\n                title:\r\n                  type: string\r\n                  description: Highlighted title with search terms\r\n                description:\r\n                  type: string\r\n                  description: Highlighted description with search terms\r\n\r\n    Category:\r\n      type: object\r\n      properties:\r\n        id:\r\n          type: string\r\n          example: \"60d0fe4f5311236168a109ca\"\r\n        name:\r\n          type: string\r\n          example: \"Work Projects\"\r\n        description:\r\n          type: string\r\n          example: \"Tasks related to work projects\"\r\n        color:\r\n          type: string\r\n          example: \"#3498db\"\r\n        userId:\r\n          type: string\r\n          example: \"60d0fe4f5311236168a109c9\"\r\n        todoCount:\r\n          type: integer\r\n          example: 5\r\n          description: Number of todos in this category\r\n        createdAt:\r\n          type: string\r\n          format: date-time\r\n        updatedAt:\r\n          type: string\r\n          format: date-time\r\n\r\n    Tag:\r\n      type: object\r\n      properties:\r\n        id:\r\n          type: string\r\n          example: \"60d0fe4f5311236168a109cc\"\r\n        name:\r\n          type: string\r\n          example: \"work\"\r\n        userId:\r\n          type: string\r\n          example: \"60d0fe4f5311236168a109c9\"\r\n        usageCount:\r\n          type: integer\r\n          example: 12\r\n          description: Number of todos using this tag\r\n        createdAt:\r\n          type: string\r\n          format: date-time\r\n        updatedAt:\r\n          type: string\r\n          format: date-time\r\n\r\n    Pagination:\r\n      type: object\r\n      properties:\r\n        page:\r\n          type: integer\r\n          example: 1\r\n        limit:\r\n          type: integer\r\n          example: 10\r\n        totalPages:\r\n          type: integer\r\n          example: 5\r\n        totalItems:\r\n          type: integer\r\n          example: 47\r\n        hasNextPage:\r\n          type: boolean\r\n          example: true\r\n        hasPreviousPage:\r\n          type: boolean\r\n          example: false\r\n\r\n    Error:\r\n      type: object\r\n      properties:\r\n        error:\r\n          type: string\r\n          example: \"Validation failed\"\r\n        message:\r\n          type: string\r\n          example: \"The provided data is invalid\"\r\n        code:\r\n          type: string\r\n          example: \"VALIDATION_ERROR\"\r\n        timestamp:\r\n          type: string\r\n          format: date-time\r\n        path:\r\n          type: string\r\n          example: \"/api/todos\"\r\n\r\n    ValidationError:\r\n      allOf:\r\n        - $ref: '#/components/schemas/Error'\r\n        - type: object\r\n          properties:\r\n            errors:\r\n              type: array\r\n              items:\r\n                type: object\r\n                properties:\r\n                  field:\r\n                    type: string\r\n                    example: \"title\"\r\n                  message:\r\n                    type: string\r\n                    example: \"Title is required\"\r\n                  value:\r\n                    type: string\r\n                    example: \"\"\r\n\r\n  responses:\r\n    BadRequest:\r\n      description: Bad request\r\n      content:\r\n        application/json:\r\n          schema:\r\n            $ref: '#/components/schemas/Error'\r\n\r\n    Unauthorized:\r\n      description: Authentication required\r\n      content:\r\n        application/json:\r\n          schema:\r\n            $ref: '#/components/schemas/Error'\r\n          example:\r\n            error: \"Unauthorized\"\r\n            message: \"Authentication token is required\"\r\n            code: \"AUTH_REQUIRED\"\r\n\r\n    NotFound:\r\n      description: Resource not found\r\n      content:\r\n        application/json:\r\n          schema:\r\n            $ref: '#/components/schemas/Error'\r\n          example:\r\n            error: \"Not Found\"\r\n            message: \"The requested resource was not found\"\r\n            code: \"RESOURCE_NOT_FOUND\"\r\n\r\n    ValidationError:\r\n      description: Validation error\r\n      content:\r\n        application/json:\r\n          schema:\r\n            $ref: '#/components/schemas/ValidationError'\r\n\r\n    RateLimited:\r\n      description: Rate limit exceeded\r\n      content:\r\n        application/json:\r\n          schema:\r\n            $ref: '#/components/schemas/Error'\r\n          example:\r\n            error: \"Rate Limit Exceeded\"\r\n            message: \"Too many requests, please try again later\"\r\n            code: \"RATE_LIMIT_EXCEEDED\"\r\n\r\ntags:\r\n  - name: Health\r\n    description: API health check endpoints\r\n  - name: Authentication\r\n    description: User authentication and session management\r\n  - name: Profile\r\n    description: User profile management\r\n  - name: Todos\r\n    description: Todo CRUD operations and advanced querying\r\n  - name: Categories\r\n    description: Todo category management\r\n  - name: Tags\r\n    description: Todo tag management";
